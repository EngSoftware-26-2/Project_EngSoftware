
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Entrar no sistema</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Entrar</button>
    </form>

    <p>
        Não possui conta?
        <a href="{% url 'cadastro' %}">Cadastre-se</a>
    </p>
</body>
</html>
