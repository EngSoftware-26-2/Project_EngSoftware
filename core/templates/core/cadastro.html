{% extends "core/base_site.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="cartao cartao-estreito">
  <h1>Criar conta</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cadastrar</button>
  </form>
  <p>Já possui conta? <a href="{% url 'login' %}">Entrar</a></p>
</div>
{% endblock %}
