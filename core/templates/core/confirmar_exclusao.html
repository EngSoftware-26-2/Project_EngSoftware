{% extends "core/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h2>{{ titulo }}: {{ projeto.nome }}</h2>
{% if aviso %}<p>{{ aviso }}</p>{% endif %}
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <div class="acoes">
    <button type="submit" class="perigo">Confirmar exclusão</button>
    <a class="botao secundario" href="{% url 'detalhe_projeto' projeto.pk %}">Cancelar</a>
  </div>
</form>
{% endblock %}
